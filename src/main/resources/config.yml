# Eclipse SMP configuration for Paper 1.21.11
# Every kingdom, boss and portal is generated from this file; no manual setup needed.

capacity-per-dimension: 10
teleport-countdown-seconds: 5

# Show the realm selector to every player, including players who already have a realm.
world-selector:
  open-on-join: true

# Maximum hearts per player, based on their dimension's boss state.
hearts:
  default: 10
  defeated: 5
  ritual: 8
  blessed: 12

boss-healing:
  amount: 25.0
  cooldown-seconds: 5
  items:
    nether: GOLD_INGOT
    end: ENDER_PEARL
    overworld: ECHO_SHARD

# 400x400 kingdoms with a cage, throne, four towers and a key portal.
kingdoms:
  # Build the three kingdoms automatically when the server starts.
  auto-build: true
  # Footprint is size x size blocks (400 = 400x400).
  size: 400
  # Radius of the paved, cleared heart of the kingdom.
  plaza-radius: 60
  # Distance at which an invader wakes a sleeping boss.
  wake-radius: 30
  # Bosses go back to sleep after this many seconds without an invader nearby.
  calm-radius: 40
  # Columns of the kingdom placed each tick (1200 keeps a server responsive).
  build-per-tick: 1200
  # Optional maps/schematics pasted over the kingdom heart. Files live in
  # plugins/DimensionWars/schematics/<name>.schem (bundled defaults are copied
  # there on first start). Leave a dimension empty for the procedural build.
  schematics:
    enabled: true
    # Blocks placed per tick while a map is pasted.
    blocks-per-tick: 12000
    # Place air too, so the map clears its own interior.
    place-air: true
    # How far the map sinks below the kingdom surface.
    sink: 4
    end: end
    nether: ''
    overworld: overworld

bosses:
  # Render the custom boss model from the resource pack instead of the vanilla mob.
  custom-model: true
  # Hide the vanilla mob underneath the custom model (recommended with the pack installed).
  hide-vanilla-model: true
  # Hitbox/model scale. 2.0 is roughly four blocks tall.
  scale: 2.0
  ritual:
    # Seconds the revival ritual takes once the catalyst is crafted at the altar.
    # 600 = 10 minutes.
    duration-seconds: 600
  nether:
    max-health: 1000.0
    damage: 8.0
    armor: 20.0
    knockback-resistance: 1.0
    ability-range: 10.0
    ability-chance-per-second: 0.35
    fire-ticks: 120
  end:
    max-health: 1024.0
    damage: 8.0
    armor: 18.0
    knockback-resistance: 0.9
    ability-range: 11.0
    ability-chance-per-second: 0.35
  overworld:
    max-health: 1024.0
    damage: 8.0
    armor: 22.0
    knockback-resistance: 1.0
    ability-range: 10.0
    ability-chance-per-second: 0.35

# Boss damage rules. All boss damage bypasses armour, enchantments and absorption.
combat:
  # Every boss melee hit: 2.0 = 1 heart.
  normal-hit-damage: 2.0
  # Every special ability hit: 7.0 damage.
  special-damage: 7.0
  # Every Nth special hit is empowered (double damage and effects).
  specials-per-empowered: 3
  # Ultimate attacks: 24.0 = 12 hearts.
  ultimate-damage: 24.0
  # The attack a boss unleashes as it dies, against the enemy team.
  final-attack:
    # 100 hearts = 200 damage.
    hearts: 100.0
    # Durability torn off every armour piece of every invader in range.
    durability: 300
    radius: 48.0

# The custom netherite warblade (CustomModelData 4001). It works in every world as
# long as the blade is in a hand or in the inventory.
warblade:
  right-click:
    # Damage dealt by the sonic boom, in half-hearts (default 80 = 40 hearts).
    damage: 80.0
    cooldown-seconds: 12
  left-click:
    cooldown-seconds: 15

# The pack is built into the jar: the plugin unzips it, hashes it and serves it over
# HTTP, so players receive the boss/keys/sword models with no external web host.
resource-pack:
  enabled: true
  self-host: true
  port: 8123
  # Public address players can reach. Leave empty to use http://<server-ip>:<port>/pack.zip.
  public-url: ''
  # Used instead of self-hosting when self-host is false.
  url: ''
  # Leave empty to use the hash of the pack the plugin hosts.
  sha1: ''
  forced: false
  prompt: '&dInstall the Eclipse SMP pack to see the custom bosses, warblade and portal keys.'

