name: EclipseSMP
version: 1.0.0
main: com.eclipsesmp.EclipseSMP
api-version: '1.21'
author: Eclipse SMP
description: Three 400x400 kingdoms, waking bosses with three phases and four abilities each, key portals, altar revival rituals and the Netherite Warblade.
website: https://papermc.io/
commands:
  esmp:
    description: Eclipse SMP v1 player and administration commands
    usage: "/esmp <menu [player]|info|key portal [dimension]|warlord sword <player>|kingdom <build|tp> <dimension>|setspawn <dimension>|setaltar <dimension>|setportal <dimension>|boss list [dimension]|boss spawn <dimension>|boss reset [dimension]|boss heal [dimension]|boss kill [dimension]|spawn boss <dimension>|ritual start <dimension>|redeem <code>|give-key <dimension>|resetplayer <player>|give-table|pack|reset|reload>"
    aliases: [dw, dimensionwars, eclipse]
permissions:
  eclipsesmp.admin:
    description: Allows kingdoms, spawns, altars, portals, bosses, rituals, warblades, resets and reloads
    default: op
  eclipsesmp.menu:
    description: Allows opening the realm selector
    default: true
  eclipsesmp.info:
    description: Allows viewing realm player counts
    default: true
